
# Project-wide Gradle settings

# 🔥 Increase memory (prevents build crashes)
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# ⚡ Enable parallel build (faster CI)
org.gradle.parallel=true

# ⚡ Enable Gradle daemon
org.gradle.daemon=true

# ⚡ Enable build caching
org.gradle.caching=true

# ✅ AndroidX support
android.useAndroidX=true

# 🔥 Required for many Capacitor / plugin dependencies
android.enableJetifier=true

# ⚡ Kotlin performance
kotlin.incremental=true

# 🔐 Signing config (REQUIRED for release build)
MYAPP_RELEASE_STORE_FILE=nextgrid-release-key.keystore
MYAPP_RELEASE_KEY_ALIAS=nextgrid
MYAPP_RELEASE_STORE_PASSWORD=yourpassword
MYAPP_RELEASE_KEY_PASSWORD=yourpassword